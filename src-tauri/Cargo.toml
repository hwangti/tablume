[package]
name = "tablume"
version = "0.1.0"
description = "가벼운 데이터베이스 클라이언트 (Tauri 실험판, MariaDB 전용)"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tablume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dirs = "6"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = 0
