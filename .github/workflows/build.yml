name: build

on:
  push:
    branches: [feat/tauri-mariadb]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
            artifact: Tablume-tauri-macos
          - os: windows-latest
            artifact: Tablume-tauri-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: npx tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = macOS ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg out/
            (cd src-tauri/target/release/bundle/macos && ditto -c -k --keepParent Tablume.app "$GITHUB_WORKSPACE/out/Tablume-macos.zip")
          else
            cp src-tauri/target/release/tablume.exe out/Tablume.exe
            cp src-tauri/target/release/bundle/nsis/*.exe out/
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
