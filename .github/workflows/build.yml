name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64) build
            artifact: Tablume-macos
          - os: windows-latest
            artifact: Tablume-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Tag matches VERSION
        if: github.ref_type == 'tag'
        shell: bash
        run: test "${{ github.ref_name }}" = "v$(tr -d '[:space:]' < VERSION)" || { echo "tag ${{ github.ref_name }} but VERSION is $(cat VERSION)"; exit 1; }
      - name: Unit tests
        run: go test ./internal/... ./build/...
      - name: Build
        run: wails3 package
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd build/bin && ditto -c -k --keepParent Tablume.app Tablume-macos-arm64.zip
      # zipped: browsers and mail often block a bare .exe
      - name: Zip Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/Tablume.exe -DestinationPath build/bin/Tablume-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/*.zip

  # On a tag, a draft release with both zips. Publishing it (on GitHub) makes
  # it the latest release, which is what the app's update check reads.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --title "Tablume ${TAG#v}" --generate-notes --verify-tag
