name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64 # Apple Silicon only (universal would also add Intel)
            artifact: Tablume-macos
          - os: windows-latest
            platform: windows/amd64
            artifact: Tablume-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Unit tests
        run: go test ./internal/...
      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }} -trimpath
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd build/bin && ditto -c -k --keepParent Tablume.app Tablume-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.zip
            build/bin/*.exe
